name: Build book

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: book

      - name: Rename PDF
        run: cp book/main.pdf Advanced_Calculus_for_Machine_Learning.pdf

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-calculus-for-machine-learning
          path: Advanced_Calculus_for_Machine_Learning.pdf

      # Rolling release: the tag "latest" follows main, and its PDF is
      # replaced on every push. The README links to this asset.
      - name: Publish PDF of the latest push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --prerelease \
              --title "Latest build" \
              --notes "PDF built from the most recent push to main."
          fi
          gh release edit latest \
            --notes "PDF built from commit ${GITHUB_SHA::7} on main."
          gh release upload latest \
            Advanced_Calculus_for_Machine_Learning.pdf --clobber

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Advanced_Calculus_for_Machine_Learning.pdf
          generate_release_notes: true
